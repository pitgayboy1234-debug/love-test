<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วันนี้วันอาราย</title>
  <style>
    body { background-color: #f3e5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    .cat { width: 150px; height: 150px; object-fit: contain; }
    .question { margin: 15px 0; font-size: 20px; color: green; font-weight: bold; }
    .btn-group { display: flex; gap: 15px; position: relative; align-items: center; justify-content: center; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
    #yesBtn { background-color: #81c784; color: white; }
    #noBtn { background-color: #e57373; color: white; position: absolute; left: 110px; }
  </style>
</head>
<body>
  <img id="catImg" src="cat1.gif" class="cat" alt="cat">
  
  <div class="question">วันนี้วันอาราย</div>

  <div class="btn-group">
    <button id="yesBtn" onclick="alert('ร๊ากกที่สู้ดดอยู่กะเค้านานๆ น้า ❤️')">วันนี้วันอาราย</button>
    <button id="noBtn" onclick="moveAndChange()">ม่ายรู้ว</button>
  </div>

  <script>
    const images = ['cat1.gif', 'cat2.gif', 'cat3.gif', 'cat4.gif', 'cat5.gif', 'cat6.gif'];
    let clickCount = 0;
    let scale = 1;

    function moveAndChange() {
      clickCount++;
      
      if (clickCount < images.length) {
        document.getElementById('catImg').src = images[clickCount];
      }

      const noBtn = document.getElementById('noBtn');

      if (clickCount >= 5) {
        noBtn.style.display = 'none';
      } else {
        scale -= 0.15;
        noBtn.style.transform = `scale(${scale})`;
        noBtn.style.position = 'fixed';
        noBtn.style.left = (Math.random() * (window.innerWidth - 100)) + 'px';
        noBtn.style.top = (Math.random() * (window.innerHeight - 50)) + 'px';
      }
    }
  </script>
</body>
</html>
