<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วันนี้วันอาราย</title>
  <style>
    body { background-color: #f3e5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    .heart { width: 50px; margin-bottom: -10px; }
    .cat { width: 150px; height: 150px; object-fit: contain; }
    .question { margin: 15px 0; font-size: 20px; }
    .green-text { color: green; font-weight: bold; }
    .red-text { color: red; font-weight: bold; }
    .btn-group { display: flex; gap: 15px; position: relative; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
    #yesBtn { background-color: #81c784; color: white; }
    #noBtn { background-color: #e57373; color: white; position: absolute; left: 110px; }
  </style>
</head>
<body>
  <img src="heart.png" class="heart" alt="heart">
  <img id="catImg" src="cat1.gif" class="cat" alt="cat">
  
  <div class="question">
    <span class="green-text">วันนี้วันอาราย</span> 
    <span class="red-text">ม่ายรู้ว</span>
  </div>

  <div class="btn-group">
    <button id="yesBtn" onclick="alert('วันครบรอบงายยร๊ากที่สู้ด ❤️')">วันนี้วันอาราย</button>
    <button id="noBtn" onmouseover="moveAndChange()" onclick="moveAndChange()">ม่ายรู้ว</button>
  </div>

  <script>
    const images = ['cat1.gif', 'cat2.gif', 'cat3.gif'];
    let imgIndex = 0;

    function moveAndChange() {
      imgIndex = (imgIndex + 1) % images.length;
      document.getElementById('catImg').src = images[imgIndex];

      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      const noBtn = document.getElementById('noBtn');
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }
  </script>
</body>
</html>
