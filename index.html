<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้วันอารายย</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #e91e63, #c2185b, #ad1457); /* พื้นหลังสีชมพูเข้ม */
            font-family: 'Tahoma', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์หัวใจลอยขึ้นตลอดเวลา */
        .heart {
            position: absolute;
            bottom: -30px;
            color: rgba(255, 192, 203, 0.7);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ข้อความหลักด้านบน */
        h1 {
            color: #2e7d32;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
            z-index: 1;
            /* ตัดขอบข้อความ */
            -webkit-text-stroke: 1.5px #ffffff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .cat-container {
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .cat-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 80px;
            width: 100%;
            z-index: 1;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            /* ตัดขอบข้อความบนปุ่ม */
            -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
        }

        .btn-anniversary {
            background-color: #4caf50;
            color: white;
            z-index: 1;
        }

        .btn-dont-know {
            background-color: #ef5350;
            color: white;
            z-index: 2;
        }

        /* Pop-up สีชมพู */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #fff0f5;
            padding: 35px 25px;
            border-radius: 25px;
            border: 4px solid #ff4081;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 85%;
            animation: popup 0.3s ease-out;
        }

        .modal-card p {
            color: #d81b60;
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 25px 0;
            line-height: 1.4;
            -webkit-text-stroke: 1px #ffffff;
        }

        .modal-card button {
            background-color: #ff4081;
            color: white;
            font-size: 20px;
            padding: 12px 30px;
            border-radius: 20px;
            -webkit-text-stroke: 0px;
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>วันนี้วันอารายย</h1>

    <div class="cat-container">
        <img id="catImg" src="cat1.gif" alt="Cat Image">
    </div>

    <div class="btn-container">
        <button class="btn-anniversary" onclick="showPopup()">วันครบรอบ</button>
        <button id="noBtn" class="btn-dont-know" onclick="handleDontKnow()">ม่ายรู้วว</button>
    </div>

    <!-- Custom Pop-up -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <p>ร๊ากกที่สู้ดดอยู่กะเค้าปายนานๆเยยย~น้า ❤️</p>
            <button onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const images = ["cat1.gif", "cat2.gif", "cat3.gif", "cat4.gif", "cat5.gif", "cat6.gif"];

        // ระบบสร้างหัวใจลอยขึ้นเรื่อยๆ แบบไม่ขาดสาย
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 4 + "s"; // ความเร็ว 4-7 วินาที
            heart.style.fontSize = Math.random() * 12 + 18 + "px"; // ขนาดสุ่มกำลังพอดี

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // ปล่อยหัวใจออกมาทุกๆ 600 มิลลิวินาที (กำลังสวย ไม่แน่นเกินไป)
        setInterval(createHeart, 600);

        function handleDontKnow() {
            clickCount++;
            const noBtn = document.getElementById("noBtn");
            const catImg = document.getElementById("catImg");

            const imgIndex = clickCount % images.length;
            catImg.src = images[imgIndex];

            if (clickCount >= 5) {
                noBtn.style.display = "none";
            } else {
                const scale = 1 - (clickCount * 0.18);
                const randomX = (Math.random() - 0.5) * 140;
                const randomY = (Math.random() - 0.5) * 140;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scale})`;
            }
        }

        function showPopup() {
            document.getElementById("customModal").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("customModal").style.display = "none";
        }
    </script>
</body>
</html>
