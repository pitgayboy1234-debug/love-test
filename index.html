<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้วันอารายย</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #e91e63, #c2185b, #ad1457);
            font-family: 'Tahoma', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์หัวใจลอย */
        .heart {
            position: absolute;
            bottom: -30px;
            color: rgba(255, 192, 203, 0.7);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* หัวข้อหลัก */
        h1 {
            color: #2e7d32;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
            z-index: 1;
            text-shadow: 
                -2px -2px 0 #ffffff,
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                 0 4px 8px rgba(0,0,0,0.3);
        }

        .cat-container {
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .cat-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 80px;
            width: 100%;
            z-index: 1;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            text-shadow: 
                -1px -1px 0 rgba(0,0,0,0.5),
                 1px -1px 0 rgba(0,0,0,0.5),
                -1px  1px 0 rgba(0,0,0,0.5),
                 1px  1px 0 rgba(0,0,0,0.5);
        }

        .btn-anniversary {
            background-color: #4caf50;
            color: white;
            z-index: 1;
        }

        .btn-dont-know {
            background-color: #ef5350;
            color: white;
            z-index: 2;
        }

        /* Pop-up ชมพูอ่อนหวานๆ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #fce4ec; /* ปรับพื้นหลังเป็นสีชมพูอ่อนหวานๆ */
            padding: 35px 25px;
            border-radius: 25px;
            border: 4px solid #ff80ab;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 85%;
            animation: popup 0.3s ease-out;
        }

        /* ขอบตัวหนังสือใน Pop-up ตัดขอบขาวชัดเจน */
        .modal-card p {
            color: #d81b60;
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 25px 0;
            line-height: 1.4;
            text-shadow: 
                -2px -2px 0 #ffffff,
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                 0 2px 4px rgba(0,0,0,0.15);
        }

        .modal-card button {
            background-color: #ff4081;
            color: white;
            font-size: 20px;
            padding: 12px 30px;
            border-radius: 20px;
            text-shadow: none;
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>วันนี้วันอารายย</h1>

    <div class="cat-container">
        <img id="catImg" src="cat1.gif" alt="Cat Image" crossorigin="anonymous">
    </div>

    <div class="btn-container">
        <button class="btn-anniversary" onclick="showPopup()">วันครบรอบ</button>
        <button id="noBtn" class="btn-dont-know" onclick="handleDontKnow()">ม่ายรู้วว</button>
    </div>

    <!-- Custom Pop-up -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <p>ร๊ากกที่สู้ดดอยู่กะเค้าปายนานๆเยยย~น้า ❤️</p>
            <button onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const images = ["cat1.gif", "cat2.gif", "cat3.gif", "cat4.gif", "cat5.gif", "cat6.gif"];

        // ฟังก์ชันลบสีขาวออกจากรูปอัตโนมัติ
        function removeWhiteBackground(imgElement) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgElement.src;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                // ตรวจหาเม็ดสีขาวแล้วปรับความโปร่งใสเป็น 0
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 230 && data[i+1] > 230 && data[i+2] > 230) {
                        data[i+3] = 0;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                imgElement.src = canvas.toDataURL();
            };
        }

        // ลบพื้นหลังรูปแรกเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            removeWhiteBackground(document.getElementById("catImg"));
        };

        // ระบบหัวใจลอย
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 4 + "s";
            heart.style.fontSize = Math.random() * 12 + 18 + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 600);

        function handleDontKnow() {
            clickCount++;
            const noBtn = document.getElementById("noBtn");
            const catImg = document.getElementById("catImg");

            const imgIndex = clickCount % images.length;
            catImg.src = images[imgIndex];
            
            // ลบสีขาวออกจากรูปใหม่ที่เปลี่ยน
            removeWhiteBackground(catImg);

            if (clickCount >= 5) {
                noBtn.style.display = "none";
            } else {
                const scale = 1 - (clickCount * 0.18);
                const randomX = (Math.random() - 0.5) * 140;
                const randomY = (Math.random() - 0.5) * 140;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scale})`;
            }
        }

        function showPopup() {
            document.getElementById("customModal").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("customModal").style.display = "none";
        }
    </script>
</body>
</html>
