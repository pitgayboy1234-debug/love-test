<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้วันอารายย</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            font-family: 'Tahoma', 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #2e7d32;
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
        }

        .cat-container {
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cat-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 80px;
            width: 100%;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-anniversary {
            background-color: #4caf50;
            color: white;
            z-index: 1;
        }

        .btn-dont-know {
            background-color: #ef5350;
            color: white;
            z-index: 2;
        }

        /* Pop-up สีชมพูสวยๆ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #fff0f5;
            padding: 30px 25px;
            border-radius: 20px;
            border: 3px solid #ff80ab;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 80%;
            animation: popup 0.3s ease-out;
        }

        .modal-card p {
            color: #d81b60;
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .modal-card button {
            background-color: #ff4081;
            color: white;
            font-size: 18px;
            padding: 10px 25px;
            border-radius: 20px;
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>วันนี้วันอารายย</h1>

    <div class="cat-container">
        <img id="catImg" src="cat1.gif" alt="Cat Image">
    </div>

    <div class="btn-container">
        <button class="btn-anniversary" onclick="showPopup()">วันครบรอบ</button>
        <button id="noBtn" class="btn-dont-know" onclick="handleDontKnow()">ม่ายรู้วว</button>
    </div>

    <!-- Custom Pop-up -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <p>ร๊ากกที่สู้ดดอยู่กะเค้าปายนานๆเยยย~น้า ❤️</p>
            <button onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const images = ["cat1.gif", "cat2.gif", "cat3.gif", "cat4.gif", "cat5.gif", "cat6.gif"];

        function handleDontKnow() {
            clickCount++;
            const noBtn = document.getElementById("noBtn");
            const catImg = document.getElementById("catImg");

            // เปลี่ยนรูปแมววนตามลำดับ
            const imgIndex = clickCount % images.length;
            catImg.src = images[imgIndex];

            if (clickCount >= 5) {
                noBtn.style.display = "none";
            } else {
                // ย่อขนาดปุ่มและสุ่มย้ายตำแหน่ง
                const scale = 1 - (clickCount * 0.18);
                const randomX = (Math.random() - 0.5) * 120;
                const randomY = (Math.random() - 0.5) * 120;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scale})`;
            }
        }

        function showPopup() {
            document.getElementById("customModal").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("customModal").style.display = "none";
        }
    </script>
</body>
</html>
