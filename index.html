<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้วันอารายย</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06292, #ec407a, #d81b60);
            font-family: 'Tahoma', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์หัวใจลอย */
        .heart-bg {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(20deg);
                opacity: 0;
            }
        }

        /* ข้อความหลักด้านบน */
        h1 {
            color: #2e7d32;
            font-size: 34px;
            margin-bottom: 20px;
            text-align: center;
            z-index: 1;
            /* ตัดขอบข้อความ */
            text-shadow: 
                -2px -2px 0 #ffffff,
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                 0 4px 8px rgba(0,0,0,0.3);
        }

        .cat-container {
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .cat-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 80px;
            width: 100%;
            z-index: 1;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            /* ตัดขอบข้อความบนปุ่ม */
            text-shadow: 
                -1px -1px 0 rgba(0,0,0,0.3),
                 1px -1px 0 rgba(0,0,0,0.3),
                -1px  1px 0 rgba(0,0,0,0.3),
                 1px  1px 0 rgba(0,0,0,0.3);
        }

        .btn-anniversary {
            background-color: #4caf50;
            color: white;
        }

        .btn-dont-know {
            background-color: #ef5350;
            color: white;
        }

        /* Custom Pop-up */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #fff0f5;
            padding: 35px 25px;
            border-radius: 25px;
            border: 4px solid #ff4081;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 85%;
            animation: popup 0.3s ease-out;
        }

        .modal-card p {
            color: #d81b60;
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 25px 0;
            line-height: 1.4;
            text-shadow: 
                -1px -1px 0 #ffffff,
                 1px -1px 0 #ffffff,
                -1px  1px 0 #ffffff,
                 1px  1px 0 #ffffff;
        }

        .modal-card button {
            background-color: #ff4081;
            color: white;
            font-size: 20px;
            padding: 12px 30px;
            border-radius: 20px;
            text-shadow: none;
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>วันนี้วันอารายย</h1>

    <div class="cat-container">
        <img id="catImg" src="cat1.gif" alt="Cat Image">
    </div>

    <div class="btn-container">
        <button class="btn-anniversary" onclick="showPopup()">วันครบรอบ</button>
        <button id="noBtn" class="btn-dont-know" onclick="handleDontKnow()">ม่ายรู้วว</button>
    </div>

    <!-- Custom Pop-up -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <p>ร๊ากกที่สู้ดดอยู่กะเค้าปายนานๆเยยย~น้า ❤️</p>
            <button onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const images = ["cat1.gif", "cat2.gif", "cat3.gif", "cat4.gif", "cat5.gif", "cat6.gif"];

        // สร้างหัวใจลอยในพื้นหลัง
        function createFloatingHearts() {
            const heartCount = 12; // จำนวนหัวใจไม่ให้รกเกินไป
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 90 + 5 + 'vw';
                heart.style.animationDuration = (Math.random() * 4 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 15 + 18) + 'px';
                document.body.appendChild(heart);
            }
        }
        createFloatingHearts();

        function handleDontKnow() {
            clickCount++;
            const noBtn = document.getElementById("noBtn");
            const catImg = document.getElementById("catImg");

            // เปลี่ยนรูปแมววนตามลำดับ
            const imgIndex = clickCount % images.length;
            catImg.src = images[imgIndex];

            if (clickCount >= 5) {
                noBtn.style.display = "none";
            } else {
                // ย่อขนาดปุ่มและสุ่มย้ายตำแหน่ง
                const scale = 1 - (clickCount * 0.18);
                const randomX = (Math.random() - 0.5) * 140;
                const randomY = (Math.random() - 0.5) * 140;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scale})`;
            }
        }

        function showPopup() {
            document.getElementById("customModal").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("customModal").style.display = "none";
        }
    </script>
</body>
</html>
